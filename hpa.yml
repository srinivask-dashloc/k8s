apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voiceaiagent-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voiceaiagent
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: voice_agent_active_calls
        target:
          type: AverageValue
          averageValue: "3"                # Scale if average active calls per pod > 3
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120      # Wait 120 seconds before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0         # Scale up quickly (0 seconds)
      policies:
        - type: Pods
          value: 1
          periodSeconds: 1
      selectPolicy: Max
